name: Build i publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pozwala workflow opublikować stronę; zapis ograniczony do Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Równoległe wdrożenia tej samej gałęzi nie mają sensu — liczy się ostatnie.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typy i 29 testów spójności bazy — na czerwonym nie publikujemy.
      - name: Kontrola jakości
        run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalacja przeglądarki
        run: npx playwright install --with-deps chromium

      - name: Testy E2E
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-playwright
          path: playwright-report/
          retention-days: 7

  deploy:
    # Publikujemy dopiero, gdy typy, testy jednostkowe i E2E są na zielono.
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
